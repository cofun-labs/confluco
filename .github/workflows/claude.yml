name: Claude

on:
  # zizmor: ignore[dangerous-triggers] the job only runs for the repo's owner, members, and collaborators.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    # Public repo and the job can push: only the owner, org members, and collaborators can summon Claude.
    # claude-code-action also rejects actors without write access.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Explain missing Claude credentials
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "Configure the CLAUDE_CODE_OAUTH_TOKEN repository secret to enable this workflow." >> "$GITHUB_STEP_SUMMARY"
      # Claude pushes fixes to the PR branch, so it keeps the checkout credentials.
      - name: Checkout repository # zizmor: ignore[artipacked]
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
