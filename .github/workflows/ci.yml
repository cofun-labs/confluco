name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main and in the merge queue are
# grouped by commit, so they never cancel each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, Format, Typecheck, Build, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      # The smoke test loads the extension that "Run checks" just built into Playwright's Chromium.
      # No --with-deps: the runner image already has the libraries Chromium needs, and the only
      # packages it would add are fonts, which took most of a minute and the test doesn't need.
      - name: Install Chromium
        run: pnpm --filter confluco-smoke exec playwright install --no-shell chromium

      - name: Run the extension smoke test
        run: pnpm --filter confluco-smoke smoke
