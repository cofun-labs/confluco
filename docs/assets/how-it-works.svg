<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
  <title id="title">How Confluco works</title>
  <desc id="desc">The Confluence tab supplies its title and URL to the side panel. The panel sends the conversation to an authenticated Worker, which calls Workers AI. Chats stay in browser storage.</desc>
  <style>
    :root{--bg:#fff;--soft:#f4f6fb;--fg:#172b4d;--muted:#6b778c;--line:#dfe4ed;--accent:#1254ed}
    @media(prefers-color-scheme:dark){:root{--bg:#1d2125;--soft:#272d34;--fg:#dee4ea;--muted:#a0abb9;--line:#3b4552;--accent:#579dff}}
    text{font-family:Arial,sans-serif;fill:var(--fg);text-anchor:middle}.muted{fill:var(--muted)}.card{fill:var(--bg);stroke:var(--line)}.frame{fill:var(--soft);stroke:var(--line);stroke-dasharray:5 5}.wire{fill:none;stroke:var(--accent);stroke-width:1.5}.arrow{fill:var(--accent)}
  </style>
  <rect class="frame" x="20" y="25" width="550" height="235" rx="12"/>
  <text class="muted" x="295" y="50" font-size="12" font-weight="600">YOUR BROWSER</text>
  <rect class="card" x="40" y="82" width="190" height="130" rx="10"/>
  <text x="135" y="126" font-size="16" font-weight="600">Confluence tab</text>
  <text class="muted" x="135" y="152" font-size="12">title and canonical URL</text>
  <rect class="card" x="355" y="82" width="195" height="130" rx="10"/>
  <text x="452" y="126" font-size="16" font-weight="600">Confluco side panel</text>
  <text class="muted" x="452" y="152" font-size="12">agent and conversation</text>
  <text class="muted" x="452" y="173" font-size="12">local saved sessions</text>
  <path class="wire" d="M230 147h116"/><path class="arrow" d="m355 147-9-5v10Z"/>
  <text class="muted" x="292" y="130" font-size="11">page metadata</text>
  <rect class="card" x="660" y="45" width="200" height="85" rx="10"/>
  <text x="760" y="80" font-size="16" font-weight="600">Worker</text>
  <text class="muted" x="760" y="104" font-size="12">verifies sign-in</text>
  <rect class="card" x="660" y="180" width="200" height="85" rx="10"/>
  <text x="760" y="215" font-size="16" font-weight="600">Workers AI</text>
  <text class="muted" x="760" y="239" font-size="12">streams the reply</text>
  <path class="wire" d="M550 112h101"/><path class="arrow" d="m660 112-9-5v10Z"/>
  <text class="muted" x="606" y="86" font-size="11">question +</text><text class="muted" x="606" y="102" font-size="11">context</text>
  <path class="wire" d="M760 130v41"/><path class="arrow" d="m760 180-5-9h10Z"/>
</svg>
