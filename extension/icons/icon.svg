<!--
  Confluco's icon, in the Cofun family design: a white page with a docked panel on the right.
  The page carries Confluco's pattern (a title bar and two bullet rows); the navy panel carries
  the white Cofun mark (an open ring with a dot just outside its gap).
  Export the manifest's PNG sizes with `pnpm icons`.
-->
